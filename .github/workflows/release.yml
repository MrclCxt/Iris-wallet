# Gera instaladores para todas as plataformas e anexa a uma release.
#
# Dispare com uma tag (`git tag v0.1.0 && git push origin v0.1.0`) ou pelo botão
# "Run workflow" na aba Actions.
#
# ATENÇÃO AO CUSTO: o repositório é privado, então os minutos de Actions são
# medidos. O runner macOS é cobrado a 10x, e compilar Rust em release é lento —
# uma execução completa consome uma fatia relevante da cota gratuita mensal.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão (ex.: v0.1.0)'
        required: true

env:
  FLUTTER_VERSION: '3.24.5'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: nttld/setup-ndk@v1
        with: { ndk-version: r26b }   # 26.1.10909125, o pinado em android/app/build.gradle

      # A assinatura vem de variáveis de ambiente: build.gradle já as consulta
      # ANTES do key.properties (que é gitignorado e não existe no runner). Sem
      # os segredos configurados, cai na chave de debug — serve para teste, mas
      # gera um APK que NÃO atualiza por cima do assinado com a chave real.
      - name: Compilar APK universal
        env:
          IRIS_KEY_ALIAS: ${{ secrets.IRIS_KEY_ALIAS }}
          IRIS_KEY_PASSWORD: ${{ secrets.IRIS_KEY_PASSWORD }}
          IRIS_STORE_FILE: ${{ github.workspace }}/keystore.jks
          IRIS_STORE_PASSWORD: ${{ secrets.IRIS_STORE_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.IRIS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$IRIS_STORE_FILE"
          fi
          flutter build apk --release 2>&1 | tee build.log

      # O cargokit pode falhar em compilar o Rust e o Gradle segue empacotando a
      # biblioteca anterior, saindo com código 0. Aconteceu neste projeto e
      # passou semanas despercebido. Falhar aqui é o ponto.
      - name: Recusar build com Rust quebrado
        run: |
          if grep -q SEVERE build.log; then
            echo "cargokit reportou SEVERE — o Rust não compilou"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/app/outputs/flutter-apk/app-release.apk

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable }
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter build linux --release
      - name: Empacotar
        run: tar -czf iris-wallet-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: iris-wallet-linux-x64.tar.gz }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable }
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter build windows --release
      - name: Empacotar
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath iris-wallet-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: iris-wallet-windows-x64.zip }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-darwin,x86_64-apple-darwin }
      - run: flutter build macos --release
      - name: Empacotar
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y "$GITHUB_WORKSPACE/iris-wallet-macos.zip" *.app
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: iris-wallet-macos.zip }

  # iOS NÃO tem job aqui, e isso é deliberado.
  #
  # Um .ipa só instala num iPhone se for assinado com um perfil de provisionamento
  # de uma conta paga do Apple Developer, e distribuído por TestFlight ou por uma
  # lista de UDIDs cadastrados. Não existe "baixar o arquivo e instalar" no iOS
  # como existe no Android. Gerar um build sem assinatura aqui produziria um
  # artefato que ninguém consegue usar — pior que não ter.

  publicar:
    needs: [android, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artefatos }
      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ github.event.inputs.versao || github.ref_name }}
        run: |
          mv artefatos/android/app-release.apk "artefatos/iris-wallet-$VERSAO.apk"
          gh release create "$VERSAO" \
            "artefatos/iris-wallet-$VERSAO.apk" \
            artefatos/linux/iris-wallet-linux-x64.tar.gz \
            artefatos/windows/iris-wallet-windows-x64.zip \
            artefatos/macos/iris-wallet-macos.zip \
            --title "Iris Wallet $VERSAO" \
            --notes "Build de teste — rede **testnet4**. Não use com bitcoin real.

          | Arquivo | Para |
          |---|---|
          | \`.apk\` | Android (universal: arm64, arm 32-bit, x86_64) |
          | \`-windows-x64.zip\` | Windows 10/11 — extraia a pasta inteira |
          | \`-linux-x64.tar.gz\` | Linux x64 — extraia e rode \`iris_wallet\` |
          | \`-macos.zip\` | macOS — extraia o \`.app\` |

          Repositório privado: baixar exige login no GitHub com acesso a ele.

          Commit: \`${{ github.sha }}\`"
