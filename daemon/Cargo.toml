[package]
name = "iris-noded"
version = "0.1.0"
edition = "2021"
description = "Daemon local do nó Lightning do Iris Wallet (LDK Node + REST em 127.0.0.1)"

[dependencies]
ldk-node = "0.3"
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
