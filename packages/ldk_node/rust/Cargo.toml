[package]
name = "ldk_node"
version = "0.3.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib"]


[build-dependencies]
anyhow = "1.0.68"
[dependencies]
flutter_rust_bridge = "=2.0.0"
anyhow = { version = "1.0.71"}
# 0.7.0 é a primeira versão com Network::Testnet4. Não voltar para a 0.3.0:
# lá o nó anuncia o ChainHash da testnet3 enquanto as transações caem na
# testnet4, e nenhum nó real aceita abrir canal.
ldk-node = { version = "0.7.0" }

# Cópia local do lightning-invoice 0.34.1 com UM patch: `From<Network> for
# Currency` não conhecia `Network::Testnet4` e caía num `_` com
# `debug_assert!` — em debug, panic ao criar qualquer fatura; em release, pior
# ainda: gerava fatura como Regtest (`lnbcrt`), inválida para o pagador.
# Testnet4 usa o mesmo HRP `lntb` da testnet3 no BOLT11.
[patch.crates-io]
lightning-invoice = { path = "vendor/lightning-invoice" }


[profile.release]
opt-level = 3     # Optimize for size.
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Reduce number of codegen units to increase optimizations.
# panic = 'unwind' (padrão): um panic em thread de background do nó (ex.:
# falha de sync com o Esplora) mata só a thread — não derruba o app inteiro.
# Com 'abort', qualquer panic virava crash 0xc0000409 do processo.

