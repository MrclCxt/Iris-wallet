[package]
name = "ldk_node"
version = "0.3.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib"]


[build-dependencies]
anyhow = "1.0.68"
[dependencies]
flutter_rust_bridge = "=2.0.0"
anyhow = { version = "1.0.71"}
ldk-node = { version = "= 0.3.0"  }
# ldk-node = {git = 'https://github.com/lightningdevkit/ldk-node.git', rev = "246775d04dbb2e99528a6a1aa0bc04ad7378e900"}

# Cópia local do ldk-node 0.3.0 com um único patch: fee_estimator.rs usa
# saturating_sub para não estourar (panic "subtract with overflow" -> abort do
# app) quando o Esplora reporta fees de testnet abaixo de 1 sat/vB.
[patch.crates-io]
ldk-node = { path = "vendor/ldk-node" }


[profile.release]
opt-level = 3     # Optimize for size.
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Reduce number of codegen units to increase optimizations.
# panic = 'unwind' (padrão): um panic em thread de background do nó (ex.:
# falha de sync com o Esplora) mata só a thread — não derruba o app inteiro.
# Com 'abort', qualquer panic virava crash 0xc0000409 do processo.

