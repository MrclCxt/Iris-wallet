name: iris_wallet
description: A real non-custodial Bitcoin & Lightning wallet with PIX integrations via DEPIX/Liquid.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State Management
  provider: ^6.1.2
  # Networking
  http: ^1.2.1
  # Security (Native Keystore/Keychain)
  flutter_secure_storage: ^9.2.2
  # Bitcoin & Crypto
  bip39: ^1.0.6
  crypto: ^3.0.3
  ldk_node: ^0.3.0
  path_provider: ^2.1.3
  # QR Codes
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.5
  # Câmera: enumeração + preview/captura no desktop Windows
  camera: ^0.10.6
  camera_windows: ^0.2.1
  # Decodificação de QR em Dart puro (pipeline de scan no Windows)
  zxing2: ^0.2.3
  image: ^4.1.7
  intl: ^0.20.2
  lwk: ^0.1.7
  share_plus: ^10.0.0
  # Salvar/abrir o arquivo de catálogo (exportar e importar entre aparelhos)
  # Versão presa em 8.0.x: a partir de 8.1 exige web ^1.0.0, que conflita com o
  # flutter_rust_bridge 2.0.0 (nó Lightning).
  file_picker: ^8.0.7
  nfc_manager: ^3.5.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: false
  windows:
    generate: true
    image_path: "assets/icons/icon_1024.png"
    icon_size: 256
  image_path: "assets/icons/icon_1024.png"
  adaptive_icon_background: "#373435"
  adaptive_icon_foreground: "assets/icons/icon_1024.png"
  min_sdk_android: 21

dependency_overrides:
  flutter_rust_bridge: 2.0.0
  # Forks locais com suporte desktop (Windows/Linux/macOS) via cargokit:
  # cada dispositivo roda o próprio nó localmente — nada de servidores externos.
  ldk_node:
    path: packages/ldk_node
  lwk:
    path: packages/lwk
