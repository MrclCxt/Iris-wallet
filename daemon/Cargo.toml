[package]
name = "iris-noded"
version = "0.2.0"
edition = "2021"
description = "Daemon local do nó Lightning do Iris Wallet (LDK Node + REST em 127.0.0.1)"

[dependencies]
# Mesma versão e mesmos remendos do nó embarcado do app: as duas pontas têm de
# anunciar a mesma rede e se comportar igual diante do Esplora.
ldk-node = "0.7.0"
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
ureq = "2"
# Segurança: token da API e semente cifrada no mesmo formato do app.
getrandom = "0.2"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
base64 = "0.22"
rpassword = "7"

# Cópias vendorizadas do app (packages/ldk_node/rust/vendor):
# - ldk-node: busca única de /fee-estimates, timeouts e concorrência do BDK
#   ajustados contra 429, e full_scan_wallets exposto;
# - lightning-invoice: Network::Testnet4 gera fatura `lntb` em vez de `lnbcrt`.
[patch.crates-io]
ldk-node = { path = "../packages/ldk_node/rust/vendor/ldk-node" }
lightning-invoice = { path = "../packages/ldk_node/rust/vendor/lightning-invoice" }

[profile.release]
opt-level = "s"
lto = true
