plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Segredos de assinatura — NUNCA embutidos no código nem exigidos em arquivo.
// Resolução modular: variável de AMBIENTE primeiro (recomendado — nada fica em
// disco), depois key.properties (gitignorado) como fallback local. O keystore
// em si vive fora do repo. A chave é o que permite ATUALIZAR o app no aparelho
// sem desinstalar (sem perder a carteira).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def resolveSecret = { String envName, String propName ->
    def v = System.getenv(envName)
    return (v != null && !v.isEmpty()) ? v : keystoreProperties[propName]
}
def signingKeyAlias = resolveSecret("IRIS_KEY_ALIAS", "keyAlias")
def signingKeyPassword = resolveSecret("IRIS_KEY_PASSWORD", "keyPassword")
def signingStoreFile = resolveSecret("IRIS_STORE_FILE", "storeFile")
def signingStorePassword = resolveSecret("IRIS_STORE_PASSWORD", "storePassword")
def hasReleaseSigning = signingStoreFile != null && signingStorePassword != null

android {
    namespace = "com.example.iris_wallet"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "26.1.10909125"

    compileOptions {
        // Exigido pelo flutter_local_notifications: ele usa APIs de data/hora
        // do Java 8 que só existem nativamente em APIs recentes, então o
        // desugaring as reescreve para funcionar no minSdk do projeto.
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                keyAlias = signingKeyAlias
                keyPassword = signingKeyPassword
                storeFile = file(signingStoreFile)
                storePassword = signingStorePassword
            }
        }
    }

    defaultConfig {
        // Identidade DEFINITIVA do app. NÃO MUDAR: alterar o applicationId faz o
        // Android instalar um app novo em vez de atualizar, o que apaga a
        // carteira (seed/PIN) do usuário.
        applicationId = "app.iriswallet"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        debug {
            // Em desenvolvimento compila as libs Rust (ldk_node/lwk) só para a
            // ABI do aparelho de teste (arm64). Compilar as 4 ABIs levava horas
            // e enchia o disco. O release continua universal.
            //
            // O `if` não é decoração: com `flutter build apk --split-per-abi` o
            // Gradle recusa abiFilters em QUALQUER buildType, mesmo o split
            // valendo só para o release — a checagem é no módulo inteiro, e o
            // build morre em "Conflicting configuration". A propriedade
            // `split-per-abi` é definida pelo próprio Flutter nesse modo.
            if (!project.hasProperty('split-per-abi')) {
                ndk {
                    abiFilters "arm64-v8a"
                }
            }
            // Assina o debug com a MESMA chave permanente do release: assim o
            // app no aparelho pode ser atualizado sempre, sem desinstalar (o
            // debug.keystore é regenerável e quebrava a atualização).
            signingConfig = hasReleaseSigning
                ? signingConfigs.release
                : signingConfigs.debug
        }
        release {
            // Assina com a chave permanente quando existir key.properties; sem
            // ela cai no debug (só para não travar o build de quem clonar).
            signingConfig = hasReleaseSigning
                ? signingConfigs.release
                : signingConfigs.debug

            // Deixa o APK/AAB o mais leve possível: R8 remove código Java/Kotlin
            // não usado e o shrinkResources descarta recursos órfãos. As libs
            // nativas (Rust: ldk_node/lwk via flutter_rust_bridge) são .so e não
            // são tocadas pelo R8; as regras de keep abaixo protegem o que usa
            // reflexão/JNI (NFC, secure storage, câmera, rust bridge).
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }
    // Para gerar um APK por arquitetura (cada aparelho baixa só a sua .so —
    // com as libs Rust isso reduz ~metade do tamanho), rode:
    //   flutter build apk --split-per-abi
    // No Google Play, prefira `flutter build appbundle` (entrega por device).
}

flutter {
    source = "../.."
}

dependencies {
    // Companheira obrigatória de `coreLibraryDesugaringEnabled` acima.
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
}
