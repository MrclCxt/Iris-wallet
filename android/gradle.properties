org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 --add-exports=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-exports=jdk.unsupported/sun.misc=ALL-UNNAMED
android.useAndroidX=true
android.enableJetifier=true
# O projeto vive no drive D: e o cache do Pub fica em C: (%LOCALAPPDATA%).
# A compilação incremental do Kotlin tenta relativizar caminhos entre os
# plugins (em C:) e o projeto (em D:), e o Java lança
# "this and base files have different roots" — drives diferentes não têm
# caminho relativo. Desligar o incremental evita o cálculo que quebra; só
# torna rebuilds um pouco mais lentos, não afeta o app.
kotlin.incremental=false
